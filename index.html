<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Missing You Sadaf</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#2b5876,#4e4376);
  transition: background 1s;
  color:white;
}

/* CARD */
.card{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  padding:35px;
  border-radius:25px;
  text-align:center;
  width:85%;
  max-width:360px;
  box-shadow:0 25px 50px rgba(0,0,0,0.5);
  animation: fade 0.8s ease;
  border:1px solid rgba(255,255,255,0.2);
}

/* TEXT */
h1{
  margin-bottom:10px;
  font-size:28px;
}

p{
  font-size:17px;
  min-height:70px;
  line-height:1.6;
}

/* BUTTON */
button{
  margin-top:25px;
  padding:12px 30px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background: linear-gradient(135deg,#ffffff,#dfe9f3);
  color:#333;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

button:hover{
  transform:scale(1.1);
}

/* PHOTO GALLERY */
.gallery{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.gallery img{
  width:250px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  animation: fade 1s ease;
}

/* ANIMATION */
@keyframes fade{
  from{opacity:0; transform:translateY(25px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body id="body">

<!-- TEXT CARD -->
<div class="card" id="card">
  <h1>Sadaf</h1>
  <p id="text">Oye🥺</p>
  <button onclick="next()">Next ➡️</button>
</div>

<!-- PHOTO SECTION -->
<div class="gallery" id="gallery">
  <h2>These moments… 💭</h2>
  <img src="img1.jpg">
  <img src="img2.jpg">
  <img src="img3.jpg">
</div>

<script>
let i = 0;

const pages = [
  {bg:"linear-gradient(135deg,#2b5876,#4e4376)", text:"Oye🥺"},
  {bg:"linear-gradient(135deg,#1e3c72,#2a5298)", text:"Mann nahi lag rha hai🥲"},
  {bg:"linear-gradient(135deg,#0f2027,#203a43,#2c5364)", text:"Kaha chali gayi hai🤧"},
  {bg:"linear-gradient(135deg,#3a1c71,#d76d77,#ffaf7b)", text:"Aise hi apne dost ko besahara chhod diya hai😣"},
  {bg:"linear-gradient(135deg,#16222a,#3a6073)", text:"Ye galat hai, mai ready nahi tha 😵‍💫"},
  {bg:"linear-gradient(135deg,#0f3460,#533483)", text:"Mera paracetamol thoda dur chala gaya🥲"},
  {bg:"linear-gradient(135deg,#1f1c2c,#928dab)", text:"Khair… tum khush raho 😇"},
  {bg:"linear-gradient(135deg,#232526,#414345)", text:"Look what I am missing..."}
];

function next(){
  if(i < pages.length - 1){
    i++;
    body.style.background = pages[i].bg;
    text.innerText = pages[i].text;
  } else {
    // SHOW PHOTOS
    document.getElementById("card").style.display = "none";
    document.getElementById("gallery").style.display = "flex";
    body.style.background = "linear-gradient(135deg,#000000,#434343)";
  }
}
</script>

</body>
</html>
